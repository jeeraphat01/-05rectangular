<div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="card stat fade"><div class="mu">ทำแล้ว</div><b style="color:#2f6fed">${s.n}</b><div class="mu">/ 50 ข้อ</div></div><div class="card stat fade"><div class="mu">ตอบถูก</div><b style="color:#16a34a">${s.c}</b><div class="mu">ข้อ</div></div><div class="card stat fade"><div class="mu">แม่นยำ</div><b style="color:#f59e0b">${s.acc}%</b><div class="mu">${s.acc>=80?'เก่งมาก!':'สู้ ๆ'}</div></div></div>
<h2>🗺️ เส้นทางการเรียนรู้</h2><div class="grid">${P.map((p,i)=>`<div class="card sc pc fade" style="--cc:${TC[i]}" onclick="go('lesson',${i})"><span style="font-size:34px">${p[0]}</span><div><b>${p[1]}</b><div class="mu">${p[2]}</div></div><span style="margin-left:auto;color:${TC[i]};font-weight:800">→</span></div>`).join('')}</div>
<div class="card"><h2>🎯 เรียนจบบทนี้แล้ว นักเรียนสามารถ</h2>${['บอกชนิดและสมบัติของรูปสี่เหลี่ยม','สร้างรูปสี่เหลี่ยมตามข้อกำหนด','หาพื้นที่ของรูปสี่เหลี่ยมด้านขนานและขนมเปียกปูน','แสดงวิธีหาคำตอบของโจทย์ปัญหาเรื่องความยาวรอบรูป','แสดงวิธีหาคำตอบของโจทย์ปัญหาเรื่องพื้นที่','แก้โจทย์ปัญหาโดยใช้ความรู้เรื่องพื้นที่และความยาวรอบรูป'].map(x=>`<div style="padding:6px 0;border-bottom:1px dashed var(--bd)">✅ ${x}</div>`).join('')}</div>
<div class="card"><h2>📊 ความก้าวหน้า</h2><div class="row" style="justify-content:space-between"><span>ทำแล้ว ${s.n}/50 ข้อ</span><span>${s.n==50?'ครบแล้ว! 🎉':'เหลือ '+(50-s.n)+' ข้อ'}</span></div>${bar(s.n*2)}${topicBars(s)}</div>`}
function res(){const s=st(),w=[],g=[];s.tp.forEach((x,i)=>{if(x.n){const p=x.c/x.n;if(p>=.8)g.push(T[i]);else if(p<.6)w.push(i)}});
const md=s.n==0?'🌱':s.acc>=80?'🏆':s.acc>=60?'🥈':'💪',msg=s.n==0?'เริ่มทำแบบฝึกหัดเพื่อดูผลของคุณ':s.acc>=80?'ยอดเยี่ยม! เข้าใจบทนี้ดีมาก':s.acc>=60?'ดีมาก! ทบทวนข้อที่ผิดอีกนิดจะเยี่ยมเลย':'สู้ ๆ! กลับไปดูบทเรียนแล้วลองใหม่นะ';
return `<div class="hero fade" style="text-align:center"><div style="font-size:56px">${md}</div><h1>${s.c} / 50 คะแนน</h1><div class="ring" style="--p:${s.acc}"><span>${s.acc}%</span></div><p>${msg}</p><div class="mu">ทำแล้ว ${s.n} · เหลือ ${50-s.n} · ถูก ${s.c} · ผิด ${s.w}</div></div>
<div class="card fade"><h3>📊 ผลรายหัวข้อ</h3>${topicBars(s)}<p>💪 <b>จุดแข็ง:</b> ${g.length?g.join(', '):'ยังไม่มีหัวข้อที่ถูกตั้งแต่ 80% ขึ้นไป'}</p><p>📌 <b>ควรปรับปรุง:</b> ${w.length?w.map(i=>T[i]).join(', '):'ไม่มีหัวข้อที่ต่ำกว่า 60%'}</p></div>
<div class="card fade"><h3>💡 คำแนะนำสำหรับคุณ</h3>${s.n==0?'<p>เริ่มทำแบบฝึกหัดเพื่อรับคำแนะนำ</p>':''}${w.map(i=>`<p>• ${T[i]}: ถูก ${s.tp[i].c}/${s.tp[i].n} ข้อ ควรทบทวนแล้วทำซ้ำ <button class="btn s" onclick="go('lesson',${TL[i]})">ไปทบทวน</button></p>`).join('')}${s.n>0&&!w.length?'<p>• ผลดี! ลองทำข้อที่เหลือและข้อท้าทายต่อ</p>':''}${s.n==50?`<p><b>สรุปรายงานฉบับสมบูรณ์:</b> ${s.acc>=80?'ยอดเยี่ยม เข้าใจบทนี้ดีมาก':s.acc>=60?'ผ่านเกณฑ์ ควรทบทวนข้อที่ผิด':'ควรกลับไปอ่านบทเรียนและดูตัวอย่างอีกครั้ง'}</p>`:`<p class="mu">ทำครบ 50 ข้อเพื่อดูรายงานสมบูรณ์ (เหลือ ${50-s.n} ข้อ)</p>`}</div>
<div class="row"><button class="btn g" onclick="go('prac')">กลับไปทำแบบฝึกหัด</button><button class="btn s" onclick="if(confirm('ล้างคะแนนและเริ่มใหม่?')){A={};SH={};HT={};S.q=0;S.set=null;sv();render()}">เริ่มใหม่ทั้งหมด</button></div>`}
let CS=1;
const CT=['เขียน CD ยาว 4.5 ซม.','ที่จุด C สร้าง ∠FCD ขนาด 70° ให้ FC ยาว 3 ซม.','ที่จุด F สร้าง ∠CFE ขนาด 110° (180 − 70) ให้ FE ยาว 4.5 ซม. จะได้ FE ขนานกับ CD','เขียน ED จะได้ □CDEF เป็นรูปสี่เหลี่ยมด้านขนาน'];
function consH(){const t=(x,y,s)=>`<text x="${x}" y="${y}" font-size="11" fill="var(--tx)" text-anchor="middle">${s}</text>`,ln=(a,b,c,d)=>`<path d="M${a},${b}L${c},${d}" stroke="#2563eb" stroke-width="2.5"/>`;
let o=`<svg viewBox="0 0 250 125" class="fig" style="max-width:380px">`;
if(CS==4)o+='<polygon points="30,100 170,100 201.8,12.6 61.8,12.6" fill="#ffe08a" opacity=".8"/>';
o+=ln(30,100,170,100)+t(30,115,'C')+t(170,115,'D')+t(100,115,'4.5 ซม.');
if(CS>=2)o+=ln(30,100,61.8,12.6)+t(61.8,9,'F')+'<path d="M50,100A20,20 0 0 0 36.8,81.2" fill="none" stroke="#c0392b"/>'+t(60,93,'70°')+t(34,55,'3 ซม.');
if(CS>=3)o+=ln(61.8,12.6,201.8,12.6)+t(201.8,9,'E')+'<path d="M79.8,12.6A18,18 0 0 1 55.6,29.5" fill="none" stroke="#c0392b"/>'+t(94,35,'110°')+t(132,9,'4.5 ซม.');
if(CS>=4)o+=ln(170,100,201.8,12.6);
return o+`</svg><div class="f">ขั้นที่ ${CS}: ${CT[CS-1]}</div><div class="row"><button class="btn s" ${CS==1?'disabled':''} onclick="CS--;csU()">← ย้อน</button><button class="btn g" ${CS==4?'disabled':''} onclick="CS++;csU()">ขั้นต่อไป →</button></div>`}
function csU(){document.getElementById('cs').innerHTML=consH()}
function cons(){CS=1;return `<div class="card" style="background:#f0f7ff"><h3>🎬 ดูการสร้างทีละขั้น: ด้านขนาน CDEF (4.5 × 3 ซม. มุม 70°)</h3><div id="cs">${consH()}</div></div>`}
const FQ=[['หาความยาวรั้วรอบสนามขนมเปียกปูน',['4 × ด้าน','สูง × ฐาน','พื้นที่ ÷ สูง'],0],['หาพื้นที่แผ่นไม้รูปด้านขนาน',['4 × ด้าน','สูง × ฐาน','พื้นที่ ÷ สูง'],1],['รู้พื้นที่และฐาน ต้องการหาความสูง',['4 × ด้าน','สูง × ฐาน','พื้นที่ ÷ ฐาน'],2]];let FM={};

function fqH(){return FQ.map((q,i)=>`<div style="margin:10px 0"><b>${i+1}. ${q[0]}</b><div>${q[1].map((o,j)=>`<span class="ch ${FM[i]==j?(j==q[2]?'good':'bad'):''}" onclick="fm(${i},${j})">${o}</span>`).join('')}</div>${FM[i]!=null?`<div class="mu">${FM[i]==q[2]?'✔ ถูกต้อง! เก่งมาก':'✘ ลองใหม่อีกครั้ง'}</div>`:''}</div>`).join('')}
function strat(){FM={};return `<div class="grid">${[['📖','1 อ่านโจทย์','ระบุสิ่งที่โจทย์ถามและสิ่งที่โจทย์บอก'],['🗺️','2 วางแผน','เขียนรูปคร่าว ๆ แล้วเลือกสูตร'],['🧮','3 คำนวณ','ทำทีละขั้น เขียนวิธีให้ชัดเจน'],['✅','4 ตรวจคำตอบ','คิดย้อนกลับ หรือประมาณค่า']].map((x,i)=>`<div class="card sc fade" style="--cc:${TC[i]}"><span style="font-size:30px">${x[0]}</span><h3>${x[1]}</h3><div class="mu">${x[2]}</div></div>`).join('')}</div><div class="card" style="background:#fff9e0"><h3>🎮 เลือกสูตรให้ถูก</h3><div id="fq">${fqH()}</div></div>`}
render();
